{% load static %}

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>棚卸登録完了</title>

    <link href="{% static 'css/styles.css' %}" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        .custom-navbar {
            background-color: #212529;
            padding: 18px 0;
        }

        .system-name {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .complete-main {
            padding-top: 160px;
            padding-bottom: 80px;
        }

        .complete-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .complete-icon {
            font-size: 60px;
            color: #198754;
            margin-bottom: 25px;
        }

        .complete-container h1 {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .complete-container p {
            color: #777;
            margin-bottom: 20px;
        }

        .back-button {
            margin-top: 35px;
        }

        .back-button a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #212529;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .back-button a:hover {
            background-color: #343a40;
            color: white;
        }

        @media (max-width: 768px) {
            .system-name {
                font-size: 16px;
            }

            .complete-main {
                padding-top: 120px;
            }

            .complete-container {
                padding: 35px 20px;
            }

            .complete-container h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <nav class="custom-navbar fixed-top">
        <div class="container">
            <span class="system-name">
                注文連動型 在庫管理・発注支援システム
            </span>
        </div>
    </nav>

    <main class="complete-main">
        <div class="container">

            <div class="complete-container">

                <div class="complete-icon">
                    <i class="fa-solid fa-circle-check"></i>
                </div>

                <h1>棚卸登録が完了しました</h1>

                <p>
                    棚卸情報の登録が完了しました。
                </p>

                <p>
                    棚卸日：{{ today|date:"Y/m/d" }}
                </p>

                <p>
                    担当者：{{ manager_name }}
                </p>

                <div class="back-button">
                    <a href="{% url 'store_top' %}">
                        店舗管理者用画面に戻る
                    </a>
                </div>

            </div>

        </div>
    </main>

    <script src="{% static 'js/scripts.js' %}"></script>

</body>
</html>
