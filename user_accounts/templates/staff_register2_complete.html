<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店員アカウント作成完了</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Meiryo", sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        .navbar {
            background-color: #212529;
            color: white;
            padding: 20px 30px;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }

        .complete-container {
            background-color: white;
            padding: 50px 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-bottom: 25px;
        }

        p {
            font-size: 17px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: #212529;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>
    <div class="navbar">
        在庫管理・発注支援システム
    </div>

    <div class="container">
        <div class="complete-container">
            <h2>店員アカウント作成完了</h2>

            <p>店員アカウントを作成しました。</p>

            <a href="{% url 'staff_list' %}" class="btn">
                店員アカウント一覧へ
            </a>
        </div>
    </div>
</body>
</html>
