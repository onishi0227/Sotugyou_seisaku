
{% load static %}

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店員情報変更</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, "Meiryo", sans-serif;
            background-color: white;
            color: #333;
        }

        .navbar {
            background-color: #212529;
            color: white;
            padding: 20px 30px;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-container {
            background-color: white;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .form-group { margin-bottom: 25px; }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 16px;
        }

        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 8px;
        }

        .button-area {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            color: white;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            background-color: #212529;
        }

        .btn:hover { opacity: 0.85; }

        @media (max-width: 576px) {
            .navbar {
                padding: 18px 15px;
                font-size: 16px;
            }

            .container {
                margin-top: 25px;
                padding: 0 12px;
            }

            .form-container { padding: 25px 18px; }
            h2 { font-size: 22px; }
        }
    </style>
</head>

<body>

    <div class="navbar">
        在庫管理・発注支援システム
    </div>

    <div class="container">

        <h2>店員情報変更</h2>

        <div class="form-container">

            {% if errors %}
                <div class="error-message">
                    {% for error in errors %}
                        <p>{{ error }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            <form id="staff-edit-form" method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label for="staff-id">社員ID</label>
                    <input
                        type="text"
                        id="staff-id"
                        name="employee_id"
                        value="{{ staff_id }}"
                        maxlength="150"
                        required
                        placeholder="社員IDを入力してください">
                </div>

                <div class="form-group">
                    <label for="staff-name">氏名</label>
                    <input
                        type="text"
                        id="staff-name"
                        name="staff_name"
                        value="{{ staff_name }}"
                        maxlength="150"
                        required
                        placeholder="氏名を入力してください">
                </div>

                <div class="form-group">
                    <label for="staff-password">新しいパスワード</label>
                    <input
                        type="password"
                        id="staff-password"
                        name="password"
                        autocomplete="new-password"
                        placeholder="変更する場合のみ入力してください">
                    <p>
                        ※変更しない場合は空欄のままにしてください。
                    </p>
                </div>

                <div class="button-area">
                    <a href="{% url 'staff_list' %}" class="btn">
                        店員アカウント一覧に戻る
                    </a>

                    <button type="submit" class="btn">
                        変更確定
                    </button>
                </div>

            </form>

        </div>
    </div>

    <script>
        document.getElementById("staff-edit-form")
            .addEventListener("submit", function(event) {

                const employeeId = document
                    .getElementById("staff-id")
                    .value.trim();

                const staffName = document
                    .getElementById("staff-name")
                    .value.trim();

                if (employeeId === "") {
                    event.preventDefault();
                    alert("社員IDを入力してください。");
                    return;
                }

                if (staffName === "") {
                    event.preventDefault();
                    alert("氏名を入力してください。");
                    return;
                }

                if (!confirm("この内容で変更しますか？")) {
                    event.preventDefault();
                }
            });
    </script>

</body>
</html>
