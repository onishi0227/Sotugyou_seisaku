{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>お客様用画面</title>

    <link href="{% static 'css/styles.css' %}" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        .custom-navbar {
            background-color: #212529;
            padding: 18px 0;
        }

        .system-name {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .customer-main {
            padding-top: 150px;
            padding-bottom: 80px;
        }

        .customer-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .customer-title h1 {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .customer-title p {
            color: #777;
        }

        .table-no {
            color: #555;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .menu-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .menu-card-link {
            display: block;
            width: 100%;
            text-decoration: none;
            color: inherit;
        }

        .menu-card-link:hover {
            text-decoration: none;
            color: inherit;
        }

        .menu-card {
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            padding: 35px 20px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .menu-card-link:hover .menu-card {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .menu-icon {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .menu-card h3 {
            margin-bottom: 15px;
        }

        .menu-card p {
            color: #777;
            margin-bottom: 0;
        }

        .back-button {
            margin-top: 50px;
            text-align: center;
        }

        @media (max-width: 576px) {
            .menu-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- ナビバー -->
    <nav class="custom-navbar fixed-top">
        <div class="container">
            <span class="system-name">
                注文連携型 在庫管理・発注支援システム
            </span>
        </div>
    </nav>

    <!-- お客様用画面 -->
    <main class="customer-main">
        <div class="container">

            <div class="customer-title">
                <h1>お客様用画面</h1>

                <!-- QRコードから受け取ったテーブル番号 -->
                <p class="table-no">
                    {{ table_no }}番テーブル
                </p>

                <p>利用する項目を選択してください</p>
            </div>

            <div class="menu-container">

                <!-- メニューを見る：一覧画面は次の段階で接続 -->
                <a href="{% url 'customer_menu' store_id=store_id table_no=table_no %}">                    
                    <div class="menu-card">

                        <div class="menu-icon">
                            <i class="fa-solid fa-utensils"></i>
                        </div>

                        <h3>メニューを見る</h3>

                        <p>
                            商品やメニューを確認します。
                        </p>

                    </div>
                </a>

                <!-- 注文履歴：画面は次の段階で接続 -->
                <a href="#" class="menu-card-link">
                    <div class="menu-card">

                        <div class="menu-icon">
                            <i class="fa-solid fa-clock-rotate-left"></i>
                        </div>

                        <h3>注文履歴</h3>

                        <p>
                            過去の注文を確認します。
                        </p>

                    </div>
                </a>

            </div>

            <div class="back-button">
                <a href="{% url 'customer_order' store_id=store_id table_no=table_no %}"
                   class="btn btn-secondary">
                    トップ画面に戻る
                </a>
            </div>

        </div>
    </main>

    <script src="{% static 'js/scripts.js' %}"></script>

</body>
</html>
