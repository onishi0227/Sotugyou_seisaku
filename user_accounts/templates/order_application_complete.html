{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>発注申請完了</title>

    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Noto Sans JP", sans-serif;
            background-color: #f5f7fa;
            color: #333;
        }

        /* ナビバー：発注一覧と統一 */
        .custom-navbar {
            background-color: #212529;
            padding: 18px 0;
            z-index: 1030;
            position: relative;
        }

        .system-name {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .user-icon {
            position: absolute;
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
            color: white !important;
            font-size: 22px;
            text-decoration: none !important;
            z-index: 9999;
        }

        .user-icon:hover {
            color: #cccccc !important;
        }

        /* メインコンテンツ */
        .complete-container {
            max-width: 700px;
            margin: 60px auto;
            padding: 130px 20px 50px;
        }

        .complete-card {
            background-color: #fff;
            border-radius: 12px;
            padding: 45px 30px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .check-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background-color: #e3f5e8;
            color: #28a745;
            font-size: 48px;
            line-height: 80px;
            font-weight: bold;
        }

        .complete-card h1 {
            font-size: 26px;
            margin-bottom: 20px;
        }

        .message {
            color: #666;
            line-height: 1.9;
            margin-bottom: 30px;
        }

        .status-box {
            background-color: #f5f7fa;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 30px;
        }

        .status-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .status {
            display: inline-block;
            background-color: #fff3cd;
            color: #856404;
            padding: 6px 18px;
            border-radius: 20px;
            font-weight: bold;
        }

        /* ボタン */
        .button-area {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            padding: 13px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
        }

        .primary-button {
            background-color: #212529;
            color: white;
        }

        .primary-button:hover {
            background-color: #343a40;
            color: white;
        }

        .secondary-button {
            background-color: #212529;
            color: white;
        }

        .secondary-button:hover {
            background-color: #343a40;
            color: white;
        }

        .note {
            margin-top: 30px;
            color: #999;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .system-name {
                font-size: 15px;
            }

            .user-icon {
                right: 15px;
                font-size: 20px;
            }

            .complete-container {
                margin: 25px auto;
                padding: 110px 15px 35px;
            }

            .complete-card {
                padding: 35px 20px;
            }

            .complete-card h1 {
                font-size: 22px;
            }

            .button {
                width: 100%;
            }

            .button-area {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <!-- ナビゲーション：発注一覧と同じデザイン -->
    <nav class="custom-navbar fixed-top">
        <div class="container">

            <span class="system-name">
                注文連携型 在庫管理・発注支援システム
            </span>


        </div>
    </nav>

    <!-- 発注申請完了 -->
    <main class="complete-container">
        <section class="complete-card">

            <div class="check-icon">✓</div>

            <h1>発注申請が完了しました</h1>

            <p class="message">
                発注申請を受け付けました。<br>
                本社で申請内容を確認します。<br>
                発注状況は発注管理画面から確認できます。
            </p>

            <div class="status-box">
                <div class="status-label">現在の申請状況</div>
                <span class="status">申請中</span>
            </div>

                <div class="button-area">
                    <a href="{% url 'purchase_management' %}"
                    class="button primary-button">
                        発注管理画面へ戻る
                    </a>

                    <a href="{% url 'store_top' %}"
                    class="button secondary-button">
                        店舗管理者用画面に戻る
                    </a>
                </div>

            <p class="note">
                ※この画面は紙芝居用のサンプル画面です。
            </p>

        </section>
    </main>

</body>
</html>
