
{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店長情報変更</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Noto Sans JP", "Meiryo", sans-serif;
            background-color: white;
            color: #172235;
        }

        .header {
            min-height: 55px;
            background-color: #252b31;
            color: white;
            display: flex;
            align-items: center;
            padding: 10px 22px;
        }

        .header-title {
            font-size: 19px;
            font-weight: bold;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: 25px auto;
            padding: 0 18px;
        }

        .page-title {
            font-size: 24px;
            margin: 0 0 6px;
            font-weight: bold;
        }

        .description {
            font-size: 14px;
            color: #4b5563;
            margin: 0 0 18px;
        }

        .form-card {
            background-color: white;
            border: 1px solid #e1e5e8;
            border-radius: 8px;
            padding: 22px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 1px solid #cbd3dc;
            border-radius: 5px;
            font-size: 14px;
            color: #222;
            background-color: white;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border: 2px solid #252b31;
        }

        .error-message {
            display: none;
            color: #dc3545;
            font-size: 12px;
            margin: 5px 0 0;
        }

        .input-invalid {
            border: 1px solid #dc3545 !important;
        }

        .server-errors {
            color: #dc3545;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .server-errors ul {
            margin: 0;
            padding-left: 22px;
        }

        .btn {
            min-height: 42px;
            padding: 9px 18px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            text-align: center;
        }

        .button-area {
            display: flex;
            justify-content: center;
            margin-top: 22px;
        }

        .save-btn {
            width: fit-content;
            background-color: #212529;
            color: white;
            border: 1px solid #343a40;
        }

        .save-btn:hover {
            background-color: #343a40;
        }

        .back-area {
            margin-top: 12px;
            text-align: center;
        }

        .back-btn {
            width: fit-content;
            background-color: #212529;
            color: white;
            border: 1px solid #172235;
        }

        .back-btn:hover {
            background-color: #343a40;
        }

        @media (max-width: 600px) {
            .header {
                padding: 14px 16px;
            }

            .header-title {
                font-size: 16px;
            }

            .container {
                margin: 22px auto;
                padding: 0 14px;
            }

            .page-title {
                font-size: 22px;
            }

            .description {
                font-size: 13px;
            }

            .form-card {
                padding: 18px 15px;
            }

            .form-group label {
                font-size: 14px;
            }

            .form-group input {
                height: 40px;
                font-size: 14px;
                padding: 0 10px;
            }

            .btn {
                min-height: 40px;
                font-size: 14px;
                padding: 9px 14px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="header-title">
            在庫管理・発注支援システム
        </div>
    </header>

    <main class="container">

        <h1 class="page-title">店長情報変更</h1>

        <p class="description">
            選択した店長の情報を編集できます。
        </p>

        <div class="form-card">

            {% if errors %}
            <div class="server-errors" role="alert">
                <ul>
                    {% for error in errors %}
                    <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            </div>
            {% endif %}

            <form
                id="staff-update-form"
                action="{% url 'manager_edit' staff_id %}"
                method="post"
            >
                {% csrf_token %}

                <!-- 店舗番号 -->
                <div class="form-group">
                    <label for="store_code">店舗番号</label>
                    <input
                        type="text"
                        id="store_code"
                        name="store_code"
                        value="{{ store_code|default:'' }}"
                        required
                    >
                </div>

                <!-- 社員ID -->
                <div class="form-group">
                    <label for="employee_id">社員ID</label>
                    <input
                        type="text"
                        id="employee_id"
                        name="employee_id"
                        value="{{ staff_id|default:'' }}"
                        aria-describedby="employee-id-error"
                        required
                    >
                    <p
                        id="employee-id-error"
                        class="error-message"
                        role="alert"
                    >半角で入力してください</p>
                </div>

                <!-- 氏名 -->
                <div class="form-group">
                    <label for="staff_name">氏名</label>
                    <input
                        type="text"
                        id="staff_name"
                        name="staff_name"
                        value="{{ staff_name|default:'' }}"
                        placeholder="氏名を入力してください"
                        required
                    >
                </div>

                <!-- パスワード -->
                <div class="form-group">
                    <label for="password">パスワード（変更する場合のみ入力）</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="変更しない場合は空欄にしてください"
                        autocomplete="new-password"
                        aria-describedby="password-halfwidth-error"
                    >

                    <p
                        id="password-halfwidth-error"
                        class="error-message"
                        role="alert"
                    >半角で入力してください</p>
                </div>

                <div class="button-area">
                    <button type="submit" class="btn save-btn">
                        変更確定
                    </button>
                </div>

            </form>
        </div>

        <div class="back-area">
            <a href="{% url 'manager_list' %}" class="btn back-btn">
                店長アカウント一覧に戻る
            </a>
        </div>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById("staff-update-form");

            const employeeId = document.getElementById("employee_id");
            const employeeIdError =
                document.getElementById("employee-id-error");

            const password = document.getElementById("password");
            const passwordHalfwidthError =
                document.getElementById("password-halfwidth-error");

            /*
             * 半角英数字・半角記号のみを許可する。
             * 空白、全角文字、日本語などはエラーにする。
             */
            function isHalfwidth(value) {
                return /^[\x21-\x7E]*$/.test(value);
            }

            // 社員IDの入力チェック
            function validateEmployeeId() {
                const valid = isHalfwidth(employeeId.value);

                employeeIdError.style.display =
                    valid ? "none" : "block";

                employeeId.classList.toggle(
                    "input-invalid",
                    !valid
                );

                if (valid) {
                    employeeId.removeAttribute("aria-invalid");
                } else {
                    employeeId.setAttribute("aria-invalid", "true");
                }

                return valid;
            }

            // パスワードの入力チェック
            // 未入力の場合は変更しないため、エラーにしない
            function validatePassword() {
                const value = password.value;

                if (value === "") {
                    passwordHalfwidthError.style.display = "none";
                    password.classList.remove("input-invalid");
                    password.removeAttribute("aria-invalid");
                    return true;
                }

                const valid = isHalfwidth(value);

                passwordHalfwidthError.style.display =
                    valid ? "none" : "block";

                password.classList.toggle(
                    "input-invalid",
                    !valid
                );

                if (valid) {
                    password.removeAttribute("aria-invalid");
                } else {
                    password.setAttribute("aria-invalid", "true");
                }

                return valid;
            }

            employeeId.addEventListener(
                "input",
                validateEmployeeId
            );

            password.addEventListener(
                "input",
                validatePassword
            );

            form.addEventListener("submit", function (event) {
                const employeeIdValid = validateEmployeeId();
                const passwordValid = validatePassword();

                if (!employeeIdValid || !passwordValid) {
                    event.preventDefault();

                    if (!employeeIdValid) {
                        employeeId.focus();
                    } else {
                        password.focus();
                    }
                }
            });
        });
    </script>

</body>
</html>
