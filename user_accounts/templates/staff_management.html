
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店員アカウント管理</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            background-color: white;
            margin: 0;
            font-family: sans-serif;
        }

        /* ナビゲーションバー */
        .custom-navbar {
            background-color: #212529;
            padding: 18px 0;
        }

        .system-name {
            color: white;
            font-size: 20px;
            font-weight: bold;
            margin: 0;
        }

        .user-icon {
            position: fixed;
            top: 18px;
            right: 30px;
            color: white;
            font-size: 22px;
            text-decoration: none;
            z-index: 1000;
        }

        .user-icon:hover {
            color: #cccccc;
        }

        /* メイン部分 */
        .management-main {
            padding: 110px 20px 60px;
        }

        .page-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 35px;
            color: #212529;
        }

        /* ボタン配置 */
        .management-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 25px;
        }

        .management-card {
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 0;
            min-height: 200px;
            padding: 30px 20px;
            background-color: white;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            color: #212529;
            text-decoration: none;
            transition: 0.2s;
        }

        .management-card:hover {
            border-color: #feb806;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .management-icon {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .management-card h3 {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin: 0;
        }

        /* 戻るボタン */
        .back-button-area {
            text-align: center;
            margin-top: 35px;
        }

        .back-button {
            display: inline-block;
            padding: 10px 25px;
            background-color: #212529;
            color: white;
            border: 1px solid #212529;
            border-radius: 6px;
            text-decoration: none;
            font-size: 15px;
            transition: 0.2s;
        }

        .back-button:hover {
            background-color: #343a40;
            color: white;
        }

        /* スマートフォン対応 */
        @media (max-width: 600px) {
            .management-container {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .management-main {
                padding-top: 90px;
            }

            .user-icon {
                right: 18px;
            }

            .system-name {
                font-size: 17px;
            }

            .management-card {
                min-height: 160px;
            }
        }
    </style>
</head>

<body>

    <!-- ナビゲーションバー -->
    <nav class="navbar custom-navbar fixed-top">
        <div class="container">
            <p class="system-name">在庫管理・発注支援システム</p>
        </div>
    </nav>

    <!-- ログアウトアイコン -->
    <a href="{% url 'logout' %}" class="user-icon" title="ログアウト">
        <i class="fa-solid fa-user"></i>
    </a>

    <!-- メインコンテンツ -->
    <main class="management-main">
        <h1 class="page-title">店員アカウント管理</h1>

        <div class="management-container">

            <!-- 店員アカウント作成 -->
            <a href="{% url 'account_register' %}" class="management-card">
                <div class="management-icon">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h3>店員アカウント作成</h3>
            </a>

           <!-- 店員アカウント一覧 -->
            <a href="{% url 'staff_list' %}" class="management-card">
                <div class="management-icon">
                    <i class="fa-solid fa-users"></i>
                </div>
                <h3>店員アカウント一覧</h3>
            </a>

        </div>

        <!-- 戻るボタン -->
        <div class="back-button-area">
            <a href="{% url 'store_top' %}" class="back-button">
                店舗管理者用画面に戻る
            </a>
        </div>
    </main>

</body>
</html>
