
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お客様用メニュー</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Meiryo", sans-serif;
            background: #f7f7f7;
            color: #333;
            padding-bottom: 110px;
        }

        header {
            background: #fff;
            padding: 18px 16px;
            text-align: center;
            border-bottom: 1px solid #eee;
            position: relative;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 22px;
        }

        .table-number {
            font-size: 14px;
            color: #666;
        }

        .staff-menu {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
        }

        .user-button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: #212529;
            color: white;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        main {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }

        .categories {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }

        .category-button {
            flex: 1;
            min-width: 0;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 22px;
            padding: 11px 5px;
            font-size: 14px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .category-button.active {
            background: #c86b42;
            color: #fff;
            border-color: #c86b42;
        }

        .menu-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            align-items: stretch;
        }

        .menu-card {
            min-width: 0;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 7px #0000000d;
            display: flex;
            flex-direction: column;
        }

        .menu-image {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            height: auto;
            object-fit: contain;
            background: #fff;
            flex-shrink: 0;
        }

        .image-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 13px;
            text-align: center;
            padding: 8px;
        }

        .menu-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .menu-name {
            font-size: 14px;
            font-weight: bold;
            line-height: 1.5;
            min-height: 42px;
            margin: 0 0 5px;
            overflow-wrap: anywhere;
        }

        .menu-price {
            font-size: 16px;
            font-weight: bold;
            color: #c86b42;
            margin-bottom: 10px;
        }

        .quantity-control {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 5px;
            margin-top: auto;
        }

        .quantity-control button {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .quantity-control button:disabled {
            opacity: .35;
            cursor: default;
        }

        .quantity {
            font-size: 15px;
            font-weight: bold;
        }

        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            background: #fff;
            border-top: 1px solid #ddd;
            box-shadow: 0 -3px 12px #0000000a;
            z-index: 10;
        }

        .cart-inner {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .cart-count {
            font-size: 12px;
            color: #666;
        }

        .cart-total {
            font-size: 19px;
            font-weight: bold;
            margin-top: 3px;
        }

        .confirm-button {
            background: #c86b42;
            color: #fff;
            border: none;
            border-radius: 9px;
            padding: 14px 18px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        .cart-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .history-button {
            background: #fff;
            color: #c86b42;
            border: 1px solid #c86b42;
            border-radius: 9px;
            padding: 14px 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            touch-action: manipulation;
        }

        .confirm-button:disabled {
            background: #ccc;
            cursor: default;
        }

        .notice {
            grid-column: 1 / -1;
            text-align: center;
            color: #777;
            font-size: 13px;
            padding: 30px 0;
        }

        .error-messages {
            background: #fff0f0;
            border: 1px solid #e5aaaa;
            color: #b00020;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .error-messages ul {
            margin: 0;
            padding-left: 20px;
        }

        @media screen and (max-width: 480px) {
            header {
                padding: 16px 12px;
            }

            header h1 {
                font-size: 20px;
            }

            .staff-menu {
                right: 12px;
            }

            .user-button {
                width: 38px;
                height: 38px;
                font-size: 18px;
            }

            main {
                padding: 12px;
            }

            .categories {
                gap: 6px;
            }

            .category-button {
                padding: 10px 4px;
                font-size: 13px;
            }

            .menu-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
            }

            .menu-info {
                padding: 8px;
            }

            .menu-name {
                font-size: 13px;
                min-height: 39px;
            }

            .menu-price {
                font-size: 14px;
            }

            .quantity-control {
                gap: 3px;
            }

            .quantity-control button {
                width: 32px;
                height: 32px;
            }

            .cart-bar {
                padding: 10px 12px;
                padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
            }

            .cart-inner {
                gap: 8px;
            }

            .cart-count {
                font-size: 11px;
            }

            .cart-total {
                font-size: 17px;
            }

            .cart-buttons {
                gap: 5px;
            }

            .history-button {
                padding: 12px 7px;
                font-size: 11px;
            }

            .confirm-button {
                padding: 12px 7px;
                font-size: 11px;
                white-space: nowrap;
            }

            body {
                padding-bottom: 125px;
            }
        }

        @media screen and (max-width: 360px) {
            main {
                padding: 10px;
            }

            .menu-list {
                gap: 7px;
            }

            .menu-info {
                padding: 7px;
            }

            .quantity-control button {
                width: 29px;
                height: 29px;
            }

            .confirm-button {
                padding: 10px 8px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>メニュー</h1>

        <div class="table-number" id="tableNumber">
            テーブル番号：{{ table_no }}
        </div>

        <div class="staff-menu">
            <button type="button"
                    class="user-button"
                    aria-label="スタッフログイン"
                    onclick="location.href='{% url 'staff_login' %}'">
                <i class="fa-solid fa-user"></i>
            </button>
        </div>
    </header>

    <main>
        {% if errors %}
            <div class="error-messages">
                <ul>
                    {% for error in errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            </div>
        {% endif %}

        <div class="categories">
            <button type="button"
                    class="category-button active"
                    data-category="すべて">すべて</button>

            <button type="button"
                    class="category-button"
                    data-category="料理">料理</button>

            <button type="button"
                    class="category-button"
                    data-category="ドリンク"
                    hidden>ドリンク</button>
        </div>

        <div class="menu-list" id="menuList"></div>
    </main>

    <div class="cart-bar">
        <div class="cart-inner">

            <div class="cart-summary">
                <div class="cart-count">
                    カート：<span id="cartCount">0</span>点
                </div>

                <div class="cart-total" id="cartTotal">¥0</div>
            </div>

            <div class="cart-buttons">
                <button type="button"
                        class="history-button"
                        id="historyButton">
                    注文履歴を見る
                </button>

                <button type="button"
                        class="confirm-button"
                        id="confirmButton"
                        disabled>
                    注文内容を確認する
                </button>
            </div>

        </div>
    </div>

    <!-- Djangoへの注文送信用フォーム -->
    <form id="orderForm"
          method="POST"
          action="{% url 'customer_order_confirm' store_id=store_id table_no=table_no %}"
          hidden>
        {% csrf_token %}
    </form>

    <script>
        // データベースの商品情報を取得
        const menus = [
            {% for product in products %}
                {
                    id: {{ product.pk }},
                    name: "{{ product.name|escapejs }}",
                    price: {{ product.price }},
                    category: "料理",
                    image: "{% if product.name == '豚の生姜焼き定食' %}/static/customer/images/豚の生姜焼き定食.jpg{% endif %}"
                }{% if not forloop.last %},{% endif %}
            {% empty %}
            {% endfor %}
        ];

        const quantities = {};
        let currentCategory = "すべて";

        const pathParts = location.pathname.split("/").filter(Boolean);
        const storeId = pathParts[1];
        const table = pathParts[2];

        if (!storeId || !table) {
            console.error("店舗IDまたはテーブル番号をURLから取得できません。");
        }

        const tableNumber = document.getElementById("tableNumber");
        tableNumber.textContent =
            "テーブル番号：" + (table || "1");

        const menuList = document.getElementById("menuList");
        const cartCount = document.getElementById("cartCount");
        const cartTotal = document.getElementById("cartTotal");
        const confirmButton = document.getElementById("confirmButton");
        const historyButton = document.getElementById("historyButton");
        const orderForm = document.getElementById("orderForm");

        // 画像が読み込めない場合の代替表示
        function createImagePlaceholder(menuName) {
            const placeholder = document.createElement("div");
            placeholder.className = "menu-image image-placeholder";
            placeholder.textContent = "画像を読み込めません";
            placeholder.setAttribute("role", "img");
            placeholder.setAttribute("aria-label", menuName + "の画像");
            return placeholder;
        }

        // メニュー一覧を表示
        function renderMenus() {
            menuList.innerHTML = "";

            const filteredMenus = menus.filter(menu =>
                currentCategory === "すべて" ||
                menu.category === currentCategory
            );

            filteredMenus.forEach(menu => {
                const quantity = quantities[menu.id] || 0;

                const card = document.createElement("article");
                card.className = "menu-card";

                let image;

                if (menu.image) {
                    image = document.createElement("img");
                    image.className = "menu-image";
                    image.src = menu.image;
                    image.alt = menu.name;
                    image.loading = "lazy";

                    image.onerror = function () {
                        const placeholder =
                            createImagePlaceholder(menu.name);
                        image.replaceWith(placeholder);
                    };
                } else {
                    image = createImagePlaceholder(menu.name);
                }

                const info = document.createElement("div");
                info.className = "menu-info";

                const name = document.createElement("p");
                name.className = "menu-name";
                name.textContent = menu.name;

                const price = document.createElement("div");
                price.className = "menu-price";
                price.textContent =
                    "¥" + Number(menu.price).toLocaleString("ja-JP");

                const controls = document.createElement("div");
                controls.className = "quantity-control";

                const minus = document.createElement("button");
                minus.type = "button";
                minus.textContent = "−";
                minus.setAttribute(
                    "aria-label", menu.name + "を1つ減らす"
                );
                minus.disabled = quantity === 0;

                minus.addEventListener("click", () => {
                    changeQuantity(menu.id, -1);
                });

                const qty = document.createElement("span");
                qty.className = "quantity";
                qty.textContent = quantity;
                qty.setAttribute("aria-label", "注文数量");

                const plus = document.createElement("button");
                plus.type = "button";
                plus.textContent = "+";
                plus.setAttribute(
                    "aria-label", menu.name + "を1つ増やす"
                );

                plus.addEventListener("click", () => {
                    changeQuantity(menu.id, 1);
                });

                controls.append(minus, qty, plus);
                info.append(name, price, controls);
                card.append(image, info);
                menuList.appendChild(card);
            });

            if (filteredMenus.length === 0) {
                const notice = document.createElement("p");
                notice.className = "notice";
                notice.textContent = menus.length === 0
                    ? "現在、販売中の商品はありません。"
                    : "メニューがありません。";
                menuList.appendChild(notice);
            }

            updateCart();
        }

        // 注文数量を変更
        function changeQuantity(id, amount) {
            quantities[id] = Math.max(
                0,
                Math.min(99, (quantities[id] || 0) + amount)
            );

            renderMenus();
        }

        // カートの点数と合計金額を更新
        function updateCart() {
            let count = 0;
            let total = 0;

            menus.forEach(menu => {
                const quantity = quantities[menu.id] || 0;
                count += quantity;
                total += menu.price * quantity;
            });

            cartCount.textContent = count;
            cartTotal.textContent =
                "¥" + total.toLocaleString("ja-JP");

            confirmButton.disabled = count === 0;
        }

        // カテゴリー切り替え
        document.querySelectorAll(".category-button").forEach(button => {
            button.addEventListener("click", () => {
                currentCategory = button.dataset.category;

                document.querySelectorAll(".category-button")
                    .forEach(item => item.classList.remove("active"));

                button.classList.add("active");
                renderMenus();
            });
        });

        // 注文確認画面へ進む
        confirmButton.addEventListener("click", () => {
            const selectedMenus = menus.filter(
                menu => (quantities[menu.id] || 0) > 0
            );

            if (selectedMenus.length === 0) {
                alert("注文する商品を1つ以上選択してください。");
                return;
            }

            if (!storeId || !table) {
                alert("店舗情報を取得できません。");
                return;
            }

            // 前回の入力値を削除
            orderForm.querySelectorAll('input[name^="quantity_"]')
                .forEach(input => input.remove());

            // Django側が要求する quantity_商品ID の形式で送信
            selectedMenus.forEach(menu => {
                const input = document.createElement("input");
                input.type = "hidden";
                input.name = "quantity_" + menu.id;
                input.value = quantities[menu.id];

                orderForm.appendChild(input);
            });

            // DjangoのビューへPOST
            orderForm.submit();
        });

        // 注文履歴画面へ移動
        historyButton.addEventListener("click", () => {
            if (!storeId || !table) {
                alert("店舗情報を取得できません。");
                return;
            }

            location.href =
                `/order/${encodeURIComponent(storeId)}/${encodeURIComponent(table)}/history`;
        });

        // 初期表示
        renderMenus();
    </script>
</body>
</html>
