
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お会計のご案内</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Meiryo", sans-serif;
            background-color: #f7f7f7;
            color: #333;
        }

        header {
            background-color: #ffffff;
            padding: 18px 16px;
            text-align: center;
            border-bottom: 1px solid #e5e5e5;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        .table-number {
            margin-top: 8px;
            color: #666;
            font-size: 14px;
        }

        main {
            max-width: 600px;
            margin: 0 auto;
            padding: 24px 16px 40px;
        }

        .complete-card {
            background-color: #ffffff;
            padding: 32px 20px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .complete-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 76px;
            height: 76px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background-color: #e5f6e9;
            color: #269b4b;
            font-size: 42px;
            font-weight: bold;
        }

        .complete-title {
            margin: 0 0 12px;
            font-size: 23px;
            color: #269b4b;
        }

        .complete-message {
            margin: 0;
            color: #666;
            font-size: 14px;
            line-height: 1.8;
        }

        .details {
            margin-top: 24px;
            padding: 20px;
            border-radius: 12px;
            background-color: #ffffff;
        }

        .details h2 {
            margin: 0 0 16px;
            font-size: 18px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            padding: 13px 0;
            border-bottom: 1px solid #eeeeee;
            font-size: 14px;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #777;
        }

        .detail-value {
            text-align: right;
            font-weight: bold;
        }

        .amount-row {
            margin-top: 6px;
            padding-top: 18px;
            border-top: 1px solid #dddddd;
        }

        .amount {
            color: #d35400;
            font-size: 23px;
        }

        .notice {
            margin-top: 20px;
            color: #777;
            font-size: 12px;
            line-height: 1.7;
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <h1>お会計のご案内</h1>

    <div class="table-number">
        テーブル <span id="tableNumber">{{ table_no }}</span>
    </div>
</header>

<main>

    <!-- レジの案内 -->
    <section class="complete-card">
        <div class="complete-icon">✓</div>

        <h2 class="complete-title">
            レジへどうぞ
        </h2>

        <p class="complete-message">
            お会計はレジにてお願いいたします。
        </p>
    </section>

    <!-- お会計情報 -->
    <section class="details">
        <h2>お会計内容</h2>

        <div class="detail-row">
            <span class="detail-label">テーブル番号</span>
            <span class="detail-value" id="detailTable">{{ table_no }}</span>
        </div>

        <div class="detail-row amount-row">
            <span class="detail-label">合計金額</span>
            <span class="detail-value amount" id="paymentTotal">
                {{ total_price|default:0 }}円
            </span>
        </div>
    </section>

</main>

<script>
    // 合計金額を3桁区切りで表示
    const total = Number("{{ total_price|default:0 }}");

    document.getElementById("paymentTotal").textContent =
        total.toLocaleString("ja-JP") + "円";
</script>

</body>
</html>
