
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>発注完了 - 在庫管理システム</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Noto Sans JP", sans-serif;
            background-color: #f5f6f8;
            color: #212529;
        }

        /* ナビゲーションバー */
        .navbar {
            background-color: #212529;
            color: white;
            padding: 18px 30px;
            font-size: 20px;
            font-weight: bold;
        }

        /* メインコンテンツ */
        .container {
            max-width: 850px;
            margin: 50px auto;
            padding: 0 20px;
        }

        /* 発注完了パネル */
        .complete-panel {
            background-color: white;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        /* 完了アイコン */
        .complete-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background-color: #d1e7dd;
            color: #198754;
            font-size: 42px;
            line-height: 70px;
            font-weight: bold;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .complete-message {
            color: #198754;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        /* 発注内容 */
        .order-details {
            text-align: left;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 22px;
            margin-top: 25px;
        }

        .order-details h2 {
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 18px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px 12px;
            border-bottom: 1px solid #dee2e6;
            text-align: left;
        }

        th {
            background-color: #f1f3f5;
        }

        /* 発注日時 */
        .order-date {
            margin-top: 22px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 6px;
            font-size: 15px;
        }

        /* ボタンエリア */
        .button-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        /* 戻るボタン共通 */
        .back-button,
        .store-button {
            display: inline-block;
            padding: 13px 25px;
            background-color: #212529;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }

        .back-button:hover,
        .store-button:hover {
            background-color: #343a40;
        }

        /* スマートフォン対応 */
        @media (max-width: 600px) {
            .navbar {
                padding: 16px 20px;
            }

            .container {
                margin-top: 25px;
            }

            .complete-panel {
                padding: 22px 16px;
            }

            h1 {
                font-size: 23px;
            }

            .order-details {
                padding: 14px;
            }

            .button-area {
                flex-direction: column;
                align-items: stretch;
            }

            .back-button,
            .store-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">
        在庫管理システム
    </header>

    <main class="container">
        <section class="complete-panel">

            <div class="complete-icon">✓</div>

            <h1>発注完了</h1>

            <p class="complete-message">
                発注が完了しました！
            </p>

            <div class="order-details">
                <h2>発注内容</h2>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>食材名</th>
                                <th>発注数量</th>
                            </tr>
                        </thead>

                        <tbody id="order-items">
                            <tr>
                                <td>豚肉</td>
                                <td>5 kg</td>
                            </tr>
                            <tr>
                                <td>玉ねぎ</td>
                                <td>10 個</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="order-date">
                    <strong>発注日時：</strong>
                    <span id="order-datetime">読み込み中...</span>
                </div>
            </div>

            <!-- 戻るボタン -->
            <div class="button-area">

                <a href="/order/" class="back-button">
                    発注管理画面に戻る
                </a>

            </div>

        </section>
    </main>

    <script>
        // 発注日時を表示
        const now = new Date();

        const formattedDate = new Intl.DateTimeFormat("ja-JP", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
        }).format(now);

        document.getElementById("order-datetime").textContent =
            formattedDate;
    </script>

</body>
</html>
