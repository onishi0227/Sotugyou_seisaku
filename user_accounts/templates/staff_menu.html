
{% load static %}

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>店長アカウント管理</title>

    <link href="{% static 'css/styles.css' %}" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* ナビバー */
        .custom-navbar {
            background-color: #212529;
            padding: 18px 0;
            position: relative;
            z-index: 1030;
        }

        .system-name {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .user-icon {
            position: absolute;
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
            color: white;
            font-size: 22px;
            text-decoration: none;
        }

        .user-icon:hover {
            color: #cccccc;
        }

        /* メイン部分 */
        .staff-main {
            padding-top: 120px;
            padding-bottom: 50px;
        }

        /* タイトル */
        .staff-title {
            text-align: center;
            margin-bottom: 45px;
        }

        .staff-title h1 {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .staff-title p {
            color: #777;
        }

        /* メニューカード */
        .menu-container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .menu-card {
            box-sizing: border-box;
            min-height: 190px;
            padding: 25px 20px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            color: inherit;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s,
                        box-shadow 0.2s,
                        border-color 0.2s;
        }

        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
            border-color: #feb806;
            color: inherit;
            text-decoration: none;
        }

        .menu-title {
            width: 100%;
            text-align: center;
        }

        .menu-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .menu-title h3 {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* 戻るボタン */
        .back-area {
            text-align: center;
            margin-top: 40px;
        }

        .back-button {
            display: inline-block;
            min-width: 280px;
            box-sizing: border-box;
            padding: 12px 20px;
            background-color: #212529;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .back-button:hover {
            background-color: #343a40;
            color: white;
            text-decoration: none;
        }

        /* スマートフォン */
        @media (max-width: 576px) {
            .system-name {
                font-size: 14px;
                padding-right: 35px;
            }

            .staff-main {
                padding-top: 95px;
            }

            .staff-title h1 {
                font-size: 26px;
            }

            .menu-container {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .menu-card {
                min-height: 170px;
            }

            .back-button {
                min-width: 0;
                width: 100%;
                max-width: 280px;
            }
        }
    </style>
</head>

<body>

    <!-- ナビバー -->
    <nav class="custom-navbar fixed-top">
        <div class="container">
            <span class="system-name">
                注文連携型 在庫管理・発注支援システム
            </span>
        </div>
    </nav>

    <!-- メイン -->
    <main class="staff-main">
        <div class="container">

            <!-- タイトル -->
            <div class="staff-title">
                <h1>店長アカウント管理</h1>
                <p>操作する項目を選択してください</p>
            </div>

            <!-- メニュー -->
            <div class="menu-container">

                <!-- 店長新規登録 -->
                <a href="{% url 'account_register' %}"
                   class="menu-card">
                    <div class="menu-title">
                        <div class="menu-icon">
                            <i class="fa-solid fa-user-plus"></i>
                        </div>

                        <h3>店長新規登録</h3>
                    </div>
                </a>

                <!-- 店長アカウント一覧・情報変更 -->
                <a href="{% url 'manager_list' %}"
                   class="menu-card">
                    <div class="menu-title">
                        <div class="menu-icon">
                            <i class="fa-solid fa-users"></i>
                        </div>

                        <h3>店長アカウント一覧・情報変更</h3>
                    </div>
                </a>

            </div>

            <!-- マスタ管理に戻る -->
            <div class="back-area">
                <a href="{% url 'headquarters_master' %}" class="back-button">
                    マスタ管理に戻る
                </a>
            </div>

        </div>
    </main>

    <script src="{% static 'js/scripts.js' %}"></script>

</body>
</html>
