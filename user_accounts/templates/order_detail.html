{% load static %}

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>発注詳細</title>

    <link href="{% static 'css/styles.css' %}" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f8f9fa;
            font-family: Arial, "Meiryo", sans-serif;
        }

        /* ナビバー */
        .custom-navbar {
            background-color: #212529;
            padding: 18px 0;
            z-index: 1030;
        }

        .system-name {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        /* メイン */
        .detail-main {
            padding-top: 110px;
            padding-bottom: 50px;
        }

        /* タイトル */
        .detail-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .detail-title h1 {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .detail-title p {
            color: #777;
        }

        /* 情報カード */
        .info-card {
            margin-bottom: 25px;
            background: white;
            border: 1px solid #d9e2ef;
            border-radius: 8px;
            overflow: hidden;
        }

        .card-heading {
            padding: 15px 20px;
            background: #f1f5fa;
            font-size: 21px;
            font-weight: bold;
        }

        .card-heading i {
            margin-right: 8px;
        }

        .info-content {
            padding: 15px 25px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 40px;
        }

        .info-row {
            display: grid;
            grid-template-columns: 130px 1fr;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #dee2e6;
            overflow-wrap: anywhere;
        }

        .info-label {
            font-weight: bold;
        }

        .memo-text {
            line-height: 1.8;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        /* 食材テーブル */
        .ingredient-container {
            padding: 15px;
            overflow-x: auto;
        }

        .ingredient-table {
            width: 100%;
            min-width: 500px;
            border-collapse: collapse;
            text-align: center;
        }

        .ingredient-table th {
            background: #f1f5fa;
            white-space: nowrap;
        }

        .ingredient-table th,
        .ingredient-table td {
            padding: 13px 15px;
            border: 1px solid #dee2e6;
        }

        .ingredient-table tbody tr:hover {
            background: #fffaf0;
        }

        .ingredient-table input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #212529;
        }

        /* ボタンエリア */
        .button-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 35px;
            flex-wrap: wrap;
        }

        /* 共通ボタン */
        .back-button,
        .confirm-button {
            display: inline-block;
            min-width: 260px;
            padding: 12px 22px;
            border: 1px solid #212529;
            border-radius: 6px;
            background-color: #212529;
            color: white;
            text-align: center;
            font-size: 16px;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .back-button:hover,
        .confirm-button:hover {
            background-color: #424649;
            border-color: #424649;
            color: white;
            text-decoration: none;
        }

        /* スマートフォン */
        @media (max-width: 768px) {
            .system-name {
                font-size: 15px;
            }

            .detail-main {
                padding-top: 90px;
            }

            .detail-title h1 {
                font-size: 27px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .info-row {
                grid-template-columns: 110px 1fr;
                gap: 10px;
            }

            .button-area {
                flex-direction: column;
                align-items: center;
            }

            .back-button,
            .confirm-button {
                box-sizing: border-box;
                width: 100%;
                max-width: 300px;
                min-width: 0;
                height: 46px;
            }
        }
    </style>
</head>

<body>

    <!-- ナビバー -->
    <nav class="custom-navbar fixed-top">
        <div class="container">
            <span class="system-name">
                注文連携型 在庫管理・発注支援システム
            </span>
        </div>
    </nav>

    <!-- メイン -->
    <main class="detail-main">
        <div class="container">

            <!-- タイトル -->
            <div class="detail-title">
                <h1>発注詳細</h1>
                <p>発注情報の詳細を確認できます</p>
            </div>

            <!-- 基本情報 -->
            <section class="info-card">
                <div class="card-heading">
                    <i class="fa-regular fa-rectangle-list"></i>
                    基本情報
                </div>

                <div class="info-content">
                    <div class="info-grid">

                        <div>
                            <div class="info-row">
                                <span class="info-label">発注ID</span>
                                <span>PO003</span>
                            </div>

                            <div class="info-row">
                                <span class="info-label">店舗</span>
                                <span>川越店</span>
                            </div>

                            <div class="info-row">
                                <span class="info-label">店長</span>
                                <span>鈴木 一郎</span>
                            </div>
                        </div>

                        <div>
                            <div class="info-row">
                                <span class="info-label">発注日時</span>
                                <span>2026/10/14 14:00</span>
                            </div>

                            <div class="info-row">
                                <span class="info-label">店舗からのメモ</span>
                                <span class="memo-text">野菜を多めにお願いします。</span>
                            </div>
                        </div>

                    </div>
                </div>
            </section>

            <!-- 発注食材一覧 -->
            <section class="info-card">
                <div class="card-heading">
                    <i class="fa-solid fa-box-open"></i>
                    発注食材一覧
                </div>

                <div class="ingredient-container">
                    <table class="ingredient-table">
                        <thead>
                            <tr>
                                <th>差し戻し</th>
                                <th>食材名</th>
                                <th>推奨数</th>
                                <th>発注数</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr>
                                <td>
                                    <input type="checkbox"
                                           name="selected_ingredients"
                                           value="トマト"
                                           aria-label="トマトを差し戻す">
                                </td>
                                <td>トマト</td>
                                <td>10</td>
                                <td>12</td>
                            </tr>

                            <tr>
                                <td>
                                    <input type="checkbox"
                                           name="selected_ingredients"
                                           value="牛肉（国産）"
                                           aria-label="牛肉（国産）を差し戻す">
                                </td>
                                <td>牛肉（国産）</td>
                                <td>5</td>
                                <td>7</td>
                            </tr>

                            <tr>
                                <td>
                                    <input type="checkbox"
                                           name="selected_ingredients"
                                           value="玉ねぎ"
                                           aria-label="玉ねぎを差し戻す">
                                </td>
                                <td>玉ねぎ</td>
                                <td>8</td>
                                <td>10</td>
                            </tr>

                            <tr>
                                <td>
                                    <input type="checkbox"
                                           name="selected_ingredients"
                                           value="レタス"
                                           aria-label="レタスを差し戻す">
                                </td>
                                <td>レタス</td>
                                <td>6</td>
                                <td>8</td>
                            </tr>

                            <tr>
                                <td>
                                    <input type="checkbox"
                                           name="selected_ingredients"
                                           value="卵"
                                           aria-label="卵を差し戻す">
                                </td>
                                <td>卵</td>
                                <td>4</td>
                                <td>5</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- 戻る・確定ボタン -->
            <div class="button-area">

                <a href="{% url 'order' %}"
                   class="back-button">
                    発注管理画面に戻る
                </a>

                <button type="button"
                        class="confirm-button"
                        onclick="confirmOrder()">
                    確定する
                </button>

            </div>

        </div>
    </main>

    <script>
    function confirmOrder() {
        // チェックされた食材を取得
        const checkedItems = document.querySelectorAll(
            'input[name="selected_ingredients"]:checked'
        );

        // チェックがある場合：差し戻し確認
        if (checkedItems.length > 0) {
            const result = window.confirm(
                "この発注、差し戻しを確定しますか？"
            );

            // OKを押した場合
            if (result) {
                // 差し戻し画面のURLを作成
                const url = new URL(
                    "{% url 'order_return' %}",
                    window.location.origin
                );

                // 選択した食材を差し戻し画面へ渡す
                checkedItems.forEach(function (item) {
                    url.searchParams.append(
                        "selected_ingredients",
                        item.value
                    );
                });

                // 差し戻し画面へ移動
                window.location.href = url.toString();
            }

            // キャンセルの場合は何もしない
            return;
        }

        // チェックがない場合：発注確定の確認
        const result = window.confirm(
            "この発注を確定しますか？"
        );

        // OKを押した場合
        if (result) {
            window.location.href = "{% url 'order_complete' %}";
        }

        // キャンセルの場合は何もしない
    }
</script>

</body>
</html>
