
{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在庫管理</title>

    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #fff;
            font-family: Arial, "Meiryo", sans-serif;
        }

        /* ヘッダー */
        .custom-navbar {
            background-color: #212529;
            padding: 18px 0;
            position: relative;
            z-index: 1030;
        }

        .custom-navbar .container {
            display: flex;
            align-items: center;
            min-height: 28px;
        }

        .system-name {
            color: white;
            font-size: 20px;
            font-weight: bold;
            padding-right: 45px;
        }

        /* メインコンテンツ */
        .stock-main {
            padding-top: 120px;
            padding-bottom: 80px;
        }

        .main-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 30px;
        }

        /* 在庫一覧タイトル */
        .stock-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .stock-title h1 {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .stock-title p {
            color: #777;
        }

        /* 日付・店舗選択エリア */
        .date-search-area {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            flex-wrap: wrap;
            gap: 12px;
            background-color: white;
            padding: 18px 20px;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .date-search-area label {
            font-weight: bold;
        }

        .date-search-area input,
        .date-search-area select {
            padding: 9px 12px;
            font-size: 15px;
            border: 1px solid #ced4da;
            border-radius: 6px;
        }

        /* 日付選択と予測ボタンを同じ列に配置 */
        .stock-search-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .stock-search-row .date-search-area {
            flex: 1;
            min-width: 0;
            margin-bottom: 0;
        }

        /* 画面切り替えボタン */
        .prediction-top {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .stock-search-row .prediction-top {
            flex-shrink: 0;
            margin-top: 0;
            margin-bottom: 0;
        }

        .prediction-button {
            display: inline-block;
            padding: 8px 16px;
            background-color: #212529;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .prediction-button:hover {
            background-color: #343a40;
        }

        /* 在庫切れ予測画面の店舗選択 */
        .prediction-store-select {
            padding: 8px 12px;
            font-size: 13px;
            height: 34px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            background-color: white;
        }

        /* 予測画面の操作部分 */
        .prediction-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .prediction-controls .date-search-area {
            flex: 1;
            min-width: 0;
            margin-bottom: 0;
        }

        /* テーブル */
        .stock-table-container {
            width: 100%;
            overflow-x: auto;
            background-color: white;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .stock-table {
            width: 100%;
            min-width: 850px;
            border-collapse: collapse;
            text-align: center;
        }

        .stock-table th {
            background-color: #212529;
            color: white;
            padding: 14px;
            white-space: nowrap;
        }

        .stock-table td {
            padding: 14px;
            border-bottom: 1px solid #dee2e6;
            white-space: nowrap;
        }

        .stock-table tbody tr:last-child td {
            border-bottom: none;
        }

        .stock-table tbody tr:hover {
            background-color: #f8f9fa;
        }

        /* 差異の数値 */
        .difference-value {
            color: #d93025;
            font-weight: bold;
        }

        /* 状態表示 */
        .status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 15px;
            background-color: #fde8e7;
            color: #b3261e;
            font-size: 13px;
            font-weight: bold;
        }

        .status.ok {
            background-color: #e2f4e8;
            color: #24723c;
        }

        .status.not-inventoried {
            background-color: #fff0db;
            color: #b76500;
        }

        .no-data {
            padding: 40px 12px !important;
            color: #777;
            text-align: center;
        }

        /* 在庫切れ予測画面 */
        .prediction-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .prediction-title {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6c757d;
            margin-bottom: 30px;
            text-align: center;
        }

        .danger {
            color: #dc3545;
            font-weight: bold;
        }

        .warning {
            color: #fd7e14;
            font-weight: bold;
        }

        .safe {
            color: #198754;
            font-weight: bold;
        }

        /* 下部ボタン */
        .button-area {
            margin-top: 40px;
            text-align: center;
        }

        .action-button {
            display: inline-block;
            padding: 10px 24px;
            background-color: #212529;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            transition: background-color 0.2s;
        }

        .action-button:hover {
            background-color: #343a40;
            color: white;
        }

        /* スマートフォン対応 */
        @media (max-width: 576px) {
            .system-name {
                font-size: 15px;
                padding-right: 35px;
            }

            .stock-main {
                padding-top: 95px;
            }

            .main-container {
                padding: 0 15px;
            }

            .stock-title h1 {
                font-size: 26px;
            }

            .stock-title p,
            .subtitle {
                font-size: 14px;
            }

            .stock-table th,
            .stock-table td {
                padding: 12px 10px;
            }

            .stock-table-container {
                padding: 15px;
            }

            .stock-search-row {
                flex-direction: column;
                align-items: stretch;
            }

            .date-search-area {
                align-items: stretch;
                flex-direction: column;
            }

            .date-search-area input,
            .date-search-area select {
                width: 100%;
            }

            .prediction-top {
                margin-bottom: 15px;
                flex-wrap: wrap;
            }

            .stock-search-row .prediction-top {
                justify-content: flex-end;
            }

            .prediction-button {
                padding: 8px 16px;
                font-size: 13px;
            }

            .prediction-store-select {
                width: auto;
                min-width: 120px;
            }

            .prediction-controls {
                justify-content: flex-end;
                flex-wrap: wrap;
            }

            .prediction-controls .date-search-area {
                width: 100%;
            }

            .prediction-header {
                padding-top: 45px;
            }

            .prediction-title {
                font-size: 26px;
            }

            .action-button {
                padding: 10px 18px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- ヘッダー -->
    <nav class="custom-navbar">
        <div class="container">
            <span class="system-name">
                注文連携型 在庫管理・発注支援システム
            </span>
        </div>
    </nav>

    <main class="stock-main">

        <!-- ================================= -->
        <!-- 在庫一覧画面 -->
        <!-- ================================= -->
        <div id="stock-list">
            <div class="main-container">

                <!-- タイトル -->
                <div class="stock-title">
                    <h1>在庫一覧</h1>
                    <p>各店舗の食材の実在庫数と理論在庫との差異や最終棚卸日を確認できます</p>
                </div>

                <!-- 日付選択・店舗選択・在庫切れ予測ボタン -->
                <div class="stock-search-row">

                    <!-- 日付選択・店舗選択 -->
                    <section class="date-search-area">
                        <label for="stock-date">棚卸日</label>

                        <input type="date"
                               id="stock-date"
                               value="{{ default_date }}"
                               min="{{ min_date }}"
                               max="{{ max_date }}"
                               onchange="showStockData()">

                        <label for="stock-store">店舗</label>

                        <select id="stock-store"
                                onchange="changeStore(this.value)">
                            {% for store in stores %}
                                <option value="{{ store.code }}">
                                    {{ store.name }}
                                </option>
                            {% empty %}
                                <option value="" selected disabled>
                                    店舗データなし
                                </option>
                            {% endfor %}
                        </select>
                    </section>

                    <!-- 在庫切れ予測ボタン -->
                    <div class="prediction-top">
                        <button type="button"
                                class="prediction-button"
                                onclick="showPrediction()">
                            <i class="fa-solid fa-chart-line"></i>
                            在庫切れ予測を確認
                        </button>
                    </div>

                </div>

                <!-- 在庫一覧テーブル -->
                <div class="stock-table-container">
                    <table class="stock-table">
                        <thead>
                            <tr>
                                <th>食材名</th>
                                <th>理論在庫</th>
                                <th>実在庫数</th>
                                <th>差異</th>
                                <th>最終棚卸日</th>
                                <th>棚卸担当者</th>
                                <th>状態</th>
                            </tr>
                        </thead>

                        <tbody id="stock-table-body">
                        </tbody>
                    </table>
                </div>

                <!-- 本社管理者用画面に戻る -->
                <div class="button-area">
                    <a href="{% url 'headquarters_top' %}" class="action-button">
                        本社管理者用画面に戻る
                    </a>
                </div>

            </div>
        </div>


        <!-- ================================= -->
        <!-- 在庫切れ予測画面 -->
        <!-- ================================= -->
        <div id="prediction-list" style="display: none;">
            <div class="main-container">

                <div class="prediction-header">
                    <h1 class="prediction-title">在庫切れ予測</h1>
                </div>

                <p class="subtitle">
                    各店舗の食材の在庫切れ予測を確認できます
                </p>

                <!-- 店舗選択・在庫一覧ボタン -->
                <div class="prediction-controls">

                    <!-- 店舗選択エリア -->
                    <section class="date-search-area">
                        <label for="prediction-store">店舗</label>

                        <select id="prediction-store"
                                class="prediction-store-select"
                                onchange="changeStore(this.value)">
                            {% for store in stores %}
                                <option value="{{ store.code }}">
                                    {{ store.name }}
                                </option>
                            {% empty %}
                                <option value="" selected disabled>
                                    店舗データなし
                                </option>
                            {% endfor %}
                        </select>
                    </section>

                    <!-- 在庫一覧ボタン -->
                    <div class="prediction-top">
                        <button type="button"
                                class="prediction-button"
                                onclick="showStock()">
                            在庫一覧
                        </button>
                    </div>

                </div>

                <!-- 在庫切れ予測テーブル -->
                <div class="stock-table-container">
                    <table class="stock-table">
                        <thead>
                            <tr>
                                <th>食材名</th>
                                <th>実在庫数</th>
                                <th>最終棚卸日</th>
                                <th>推奨発注数</th>
                                <th>予測状況</th>
                            </tr>
                        </thead>

                        <tbody id="prediction-table-body">
                        </tbody>
                    </table>
                </div>

                <div class="button-area">
                    <a href="{% url 'headquarters_top' %}" class="action-button">
                        本社管理者用画面に戻る
                    </a>
                </div>

            </div>
        </div>

    </main>

    <!-- Djangoから受け取った実データ -->
    {{ stock_data|json_script:"stock-data" }}
    {{ prediction_data|json_script:"prediction-data" }}

    <!-- JavaScript -->
    <script>
        // Djangoから受け取ったデータ
        const stockHistory = JSON.parse(
            document.getElementById("stock-data").textContent
        );

        const predictionHistory = JSON.parse(
            document.getElementById("prediction-data").textContent
        );

        // 現在選択されている店舗
        const stockStoreSelect = document.getElementById("stock-store");
        const predictionStoreSelect = document.getElementById("prediction-store");

        let selectedStore = stockStoreSelect.value;


        // データがない場合の行を表示する
        function showNoData(tableBody, message, colSpan) {
            const row = document.createElement("tr");
            const cell = document.createElement("td");

            cell.colSpan = colSpan;
            cell.className = "no-data";
            cell.textContent = message;

            row.appendChild(cell);
            tableBody.appendChild(row);
        }


        // 店舗を変更する
        function changeStore(store) {
            selectedStore = store;

            // もう一方の画面の店舗選択も同期
            stockStoreSelect.value = selectedStore;
            predictionStoreSelect.value = selectedStore;

            // 両方のデータを更新
            showStockData();
            showPredictionData();
        }


        // 選択した日付・店舗の棚卸データを表示
        function showStockData() {
            const selectedDate = document.getElementById("stock-date").value;
            const tableBody = document.getElementById("stock-table-body");

            tableBody.replaceChildren();

            if (!selectedDate) {
                showNoData(
                    tableBody,
                    "棚卸日を選択してください。",
                    7
                );
                return;
            }

            if (!selectedStore) {
                showNoData(
                    tableBody,
                    "店舗データがありません。",
                    7
                );
                return;
            }

            const storeData = stockHistory[selectedStore];
            const data = storeData ? storeData[selectedDate] : null;

            if (!data || data.length === 0) {
                showNoData(
                    tableBody,
                    "選択した日付の棚卸データはありません。",
                    7
                );
                return;
            }

            const formattedDate = selectedDate.replace(/-/g, "/");

            data.forEach(function(item) {
                const row = document.createElement("tr");

                const values = [
                    item.name,
                    item.theoretical,
                    item.quantity,
                    item.difference,
                    formattedDate,
                    item.staff
                ];

                values.forEach(function(value, index) {
                    const cell = document.createElement("td");

                    cell.textContent = value ?? "—";

                    // 差異の列を赤字にする
                    if (
                        index === 3 &&
                        item.difference !== "0" &&
                        item.difference !== "—"
                    ) {
                        cell.className = "difference-value";
                    }

                    row.appendChild(cell);
                });

                // 状態表示
                const statusCell = document.createElement("td");
                const statusLabel = document.createElement("span");

                statusLabel.textContent = item.status;

                if (item.ok) {
                    statusLabel.className = "status ok";
                } else if (item.status === "棚卸済み") {
                    statusLabel.className = "status not-inventoried";
                } else {
                    statusLabel.className = "status";
                }

                statusCell.appendChild(statusLabel);
                row.appendChild(statusCell);

                tableBody.appendChild(row);
            });
        }


        // 選択した店舗の在庫切れ予測データを表示
        function showPredictionData() {
            const tableBody = document.getElementById("prediction-table-body");
            const data = predictionHistory[selectedStore];

            tableBody.replaceChildren();

            if (!selectedStore || !data || data.length === 0) {
                showNoData(
                    tableBody,
                    "選択した店舗の予測データはありません。",
                    5
                );
                return;
            }

            data.forEach(function(item) {
                const row = document.createElement("tr");

                const values = [
                    item.name,
                    item.quantity,
                    item.date,
                    item.order
                ];

                values.forEach(function(value) {
                    const cell = document.createElement("td");

                    cell.textContent = value ?? "—";
                    row.appendChild(cell);
                });

                const statusCell = document.createElement("td");

                statusCell.textContent = item.status;
                statusCell.className = item.className;

                row.appendChild(statusCell);
                tableBody.appendChild(row);
            });
        }


        // 在庫切れ予測画面に切り替える
        function showPrediction() {
            showPredictionData();

            document.getElementById("stock-list").style.display = "none";
            document.getElementById("prediction-list").style.display = "block";
        }


        // 在庫一覧画面に戻る
        function showStock() {
            document.getElementById("prediction-list").style.display = "none";
            document.getElementById("stock-list").style.display = "block";

            showStockData();
        }


        // 初期表示
        window.addEventListener("DOMContentLoaded", function() {
            if (selectedStore) {
                predictionStoreSelect.value = selectedStore;
            }

            showStockData();
            showPredictionData();
        });
    </script>

    <script src="{% static 'js/scripts.js' %}"></script>

</body>
</html>
