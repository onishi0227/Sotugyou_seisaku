{% load static %}

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>在庫管理メニュー</title>

    <!-- 共通CSS -->
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* ナビバー */
        .custom-navbar {
            background-color: #212529;
            padding: 18px 0;
            z-index: 1030;
            position: relative;
        }

        .system-name {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        /* メイン部分 */
        .stock-main {
            padding-top: 100px;
            padding-bottom: 50px;
        }

        /* タイトル */
        .stock-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .stock-title h1 {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .stock-title p {
            color: #777;
        }

        /* メニューカード：2列 */
        .menu-container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 750px;
            margin: 0 auto;
        }

        /* 管理カード */
        .menu-card {
            box-sizing: border-box;
            min-height: 190px;
            padding: 30px 25px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s,
                        box-shadow 0.2s,
                        border-color 0.2s;
        }

        /* ホバー時 */
        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
            border-color: #feb806;
            color: inherit;
            text-decoration: none;
        }

        /* カード内 */
        .menu-title {
            text-align: center;
            width: 100%;
        }

        .menu-title .menu-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .menu-title h3 {
            font-weight: bold;
            margin-bottom: 0;
        }

        /* 戻るボタン */
        .back-area {
            text-align: center;
            margin-top: 40px;
        }

        .back-button {
            display: inline-block;
            padding: 12px 28px;
            background-color: #212529;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .back-button:hover {
            background-color: #343a40;
            color: white;
            text-decoration: none;
        }

        /* スマートフォン */
        @media (max-width: 576px) {
            .system-name {
                font-size: 15px;
            }

            .stock-main {
                padding-top: 90px;
            }

            .stock-title h1 {
                font-size: 26px;
            }

            /* スマホでは縦並び */
            .menu-container {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .menu-card {
                min-height: 160px;
            }
        }
    </style>
</head>

<body>

    <!-- ナビバー -->
    <nav class="custom-navbar">
        <div class="container">
            <span class="system-name">
                注文連携型 在庫管理・発注支援システム
            </span>
        </div>
    </nav>

    <!-- メイン -->
    <main class="stock-main">
        <div class="container">

            <!-- タイトル -->
            <div class="stock-title">
                <h1>在庫メニュー</h1>
                <p>操作する項目を選択してください</p>
            </div>

            <!-- 在庫メニュー -->
            <div class="menu-container">

                <!-- 在庫差異 -->
                    <a href="#"
                    class="menu-card">
                    <div class="menu-title">
                        <div class="menu-icon">
                            <i class="fa-solid fa-clipboard-list"></i>
                        </div>
                        <h3>在庫差異</h3>
                    </div>
                </a>

                <!-- 店舗別在庫 -->
                    <a href="#"
                    class="menu-card">
                    <div class="menu-title">
                        <div class="menu-icon">
                            <i class="fa-solid fa-store"></i>
                        </div>
                        <h3>店舗別在庫</h3>
                    </div>
                </a>

            </div>

            <!-- 本社管理者用画面へ戻る -->
            <div class="back-area">
                <a href="{% url 'headquarters_top' %}"
                class="back-button">
                    本社管理者用画面に戻る
                </a>
            </div>

        </div>
    </main>

    <!-- JavaScript -->
    <script src="{% static 'js/scripts.js' %}"></script>

</body>
</html>
