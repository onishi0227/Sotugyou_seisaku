{% load static %}

<!DOCTYPE html>

<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在庫管理</title>


<!-- AgencyのCSS -->
<link href="{% static 'css/styles.css' %}" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

    /* ナビバー */
    .custom-navbar {
        background-color: #212529;
        padding: 18px 0;
        z-index: 1030;
        position: relative;
    }

    .system-name {
        color: white;
        font-size: 20px;
        font-weight: bold;
    }

    /* ユーザーアイコン */
    .user-icon {
        position: absolute;
        top: 50%;
        right: 30px;
        transform: translateY(-50%);
        color: white !important;
        font-size: 22px;
        text-decoration: none !important;
        z-index: 9999;
    }

    .user-icon:hover {
        color: #cccccc;
    }

    /* メイン部分 */
    .inventory-main {
        padding-top: 130px;
    }

    /* タイトル */
    .inventory-title {
        text-align: center;
        margin-bottom: 50px;
    }

    .inventory-title h1 {
        font-weight: bold;
        margin-bottom: 15px;
    }

    .inventory-title p {
        color: #777;
    }

    /* メニュー */
    .inventory-container {
        display: grid;
        grid-template-columns: repeat(2, minmax(280px, 400px));
        justify-content: center;
        gap: 40px;
        width: 100%;
    }

    /* メニューカード */
    .inventory-card {
        box-sizing: border-box;
        min-height: 190px;
        padding: 30px 25px;

        border: 2px solid #dee2e6;
        border-radius: 10px;
        background-color: white;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);

        text-decoration: none;
        color: inherit;

        transition: transform 0.2s,
                    box-shadow 0.2s;
    }

    /* カーソルを合わせたとき */
    .inventory-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        color: inherit;
        text-decoration: none;
    }

    /* アイコン・タイトル */
    .inventory-card-content {
        text-align: center;
    }

    .inventory-icon {
        font-size: 45px;
        margin-bottom: 15px;
    }

    .inventory-card h3 {
        font-weight: bold;
        margin-bottom: 0;
    }

    /* 店舗画面に戻る */
    .back-button {
        margin-top: 30px;
        text-align: center;
    }

    /* タブレット */
    @media (max-width: 992px) {
        .inventory-container {
            grid-template-columns: 1fr;
        }
    }

</style>


</head>

<body>


<!-- ナビバー -->
<nav class="custom-navbar fixed-top">
    <div class="container">

        <span class="system-name">
            注文連携型 在庫管理・発注支援システム
        </span>

        <a href="{% url 'logout' %}"
           class="user-icon"
           title="ログアウト">
            <i class="fa-solid fa-user"></i>
        </a>

    </div>
</nav>

<!-- メイン -->
<main class="inventory-main">
    <div class="container">

        <!-- タイトル -->
        <div class="inventory-title">
            <h1>在庫管理</h1>
            <p>操作する項目を選択してください</p>
        </div>

        <!-- メニュー -->
        <div class="inventory-container">

            <!-- 在庫一覧 -->
            <a href="{% url 'inventory_list' %}"
            class="inventory-card">

                <div class="inventory-card-content">

                    <div class="inventory-icon">
                        <i class="fa-solid fa-boxes-stacked"></i>
                    </div>

                    <h3>在庫一覧</h3>

                </div>

            </a>

            <!-- 在庫切れ予測 -->
            <a href="{% url 'stockout_prediction' %}"
            class="inventory-card">

                <div class="inventory-card-content">

                    <div class="inventory-icon">
                        <i class="fa-solid fa-chart-line"></i>
                    </div>

                    <h3>在庫切れ予測</h3>

                </div>

            </a>

        </div>

        <!-- 店舗画面に戻る -->
        <div class="back-button">
            <a href="{% url 'store_top' %}"
            class="btn btn-secondary">
                店舗画面に戻る
            </a>
        </div>

    </div>
</main>

<!-- JavaScript -->
<script src="{% static 'js/scripts.js' %}"></script>


</body>
</html>
